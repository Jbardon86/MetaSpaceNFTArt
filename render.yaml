# Render.com blueprint — one-click deploy of the Endless Fun Orders backend.
# In Render: New → Blueprint → connect this repo → it reads this file.
# Then set the secret env vars (marked sync:false) in the Render dashboard.
services:
  - type: web
    name: endlessfun-orders-backend
    runtime: node
    plan: free
    branch: main
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # SOS Inventory (shared catalog)
      # Business-card scanning (AI vision)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SOS_BASE_URL
        value: https://api.sosinventory.com
      - key: SOS_CLIENT_ID
        sync: false
      - key: SOS_CLIENT_SECRET
        sync: false
      - key: SOS_ACCESS_TOKEN
        sync: false
      - key: SOS_REFRESH_TOKEN
        sync: false
      # SOS rotates its refresh token on every refresh. The backend writes the
      # new tokens back to these env vars through the Render API, which needs
      # a Render account API key here. Without it, SOS breaks after ~90 days.
      - key: RENDER_API_KEY
        sync: false
      - key: SOS_TOKEN_REFRESHED_AT
        sync: false
      # Shared secret for /api/sos/tracking (label bot -> SOS). Render generates
      # it; the label bot reads the same value via fromService below.
      - key: LABEL_BOT_KEY
        generateValue: true
      # Microsoft 365 email (order confirmations from order@endlessfun.biz)
      - key: SMTP_HOST
        value: smtp.office365.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: order@endlessfun.biz
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: Endless Fun <order@endlessfun.biz>
      # Salesforce (Lead + Opportunity per order) — Connected App, Client
      # Credentials flow. Leave blank to disable. TEST IN THE SANDBOX FIRST:
      # set SF_LOGIN_URL to https://test.salesforce.com for the sandbox.
      - key: SF_LOGIN_URL
        sync: false
      - key: SF_CLIENT_ID
        sync: false
      - key: SF_CLIENT_SECRET
        sync: false
      - key: SF_API_VERSION
        value: v62.0
      - key: SF_LEAD_SOURCE
        value: Trade Show
      - key: SF_OPP_STAGE
        value: Proposal
      - key: SF_CREATE_OPPORTUNITY
        value: "1"
      - key: SF_ADD_LINE_ITEMS
        value: "1"
      - key: SF_LINK_ACCOUNT
        value: "1"
      - key: SF_CREATE_ACCOUNT
        value: "1"
      # Booth fallback rep (SOS rep id) for kiosk orders that name no rep. Blank
      # = leave the Opportunity's Sales Rep unassigned for Jeff to set.
      - key: SF_DEFAULT_REP_SOS_ID
        sync: false

  # Hosted web version of the app — a shareable link anyone can open in a browser.
  - type: web
    name: endlessfun-orders-web
    runtime: static
    branch: main
    rootDir: tradeshow-app
    buildCommand: npm install && npx expo export --platform web && node scripts/inject-pwa-icon.js
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Magic Straws shipping-label bot: buys USPS Ground Advantage labels for paid,
  # unfulfilled Shopify orders. Schedule is UTC: every 30 min, 10:00-23:30 UTC
  # every day = 4:00 AM-5:30 PM Central (standard time). DRY_RUN "false" = live
  # label buying (set 2026-11-13). "true" = test mode, logs only.
  # Each run also writes tracking numbers into SOS (see SOS_SYNC).
  - type: cron
    name: magicstraws-shipping-label-bot
    runtime: node
    plan: starter
    branch: main
    rootDir: shipping-label-bot
    schedule: "0,30 10-23 * * *"
    buildCommand: "true"
    startCommand: node index.js
    envVars:
      - key: SHOPIFY_SHOP
        value: magic-sparkle-shop-slbiu
      - key: DRY_RUN
        value: "false"
      - key: MAX_LABELS_PER_RUN
        value: "15"
      - key: MAX_UNITS_PER_ORDER
        value: "24"
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      # SOS step: "dry" = check receipts and log only, "on" = write tracking
      # into SOS sales receipts, "off" = skip. Calls go through the backend,
      # which holds the one SOS login.
      - key: SOS_SYNC
        value: dry
      - key: BACKEND_URL
        value: https://endlessfun-orders-backend.onrender.com
      - key: LABEL_BOT_KEY
        fromService:
          type: web
          name: endlessfun-orders-backend
          envVarKey: LABEL_BOT_KEY
